[tool.poetry]
name = "humanoid-robot-delivery-toolchain"
version = "0.1.0"
description = "A toolchain for humanoid robot delivery, connecting to ROS1 systems."
authors = ["mayichao"]
license = "MIT"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
PyQt6 = ">=6.5"
roslibpy = ">=1.6"
paramiko = ">=2.11"
requests = ">=2.28"
PyYAML = ">=6.0"
matplotlib = ">=3.8"
reportlab = ">=4.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"